<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 5 - Users API</title>

    <script src="users.js" defer></script>
</head>

<body>

    <header>
        <h1>Users Directory</h1>
        <p>Load and search users from an API.</p>
    </header>

    <main>

        <section>
            <button id="load-users" type="button">
                Load Users
            </button>

            <p id="status">Click the button to load users.</p>
        </section>

        <section>
            <label for="filter-input">Filter users:</label>

            <input
                type="text"
                id="filter-input"
                placeholder="Search by name..."
            >
        </section>

        <section>
            <ul id="users-list"></ul>
        </section>

    </main>

</body>
</html>
